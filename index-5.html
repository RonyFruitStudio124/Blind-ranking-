<!doctype html>
<!--
  BLIND RANKING & CHALLENGE  |  single-file edition
  Version 0.3.0  |  Camera integration: live preview on the Play screen.
                    Face tracking and video recording are NOT implemented yet.

  PURPOSE
    Offline-first Blind Ranking app (10 slots, categories, live camera with head tracking,
    recording, sharing). This file is the primary development and test entry point.
    It is plain HTML + CSS + JavaScript (JSDoc types). No build tools, no external requests.

  HOW TO TEST
    Host on GitHub Pages (HTTPS) and open in Chrome. Diagnostics (module list, browser
    capabilities, real camera check, self-tests) live at #/diagnostics. Opening the address
    with #tests runs the automated self-tests. Those use a SIMULATED camera. Only the manual
    "Real camera check" card in Diagnostics, and Start camera on the Play screen, use the
    real camera, and only when the player taps them.

  SCREENS (hash routes)
    #/                 Home: category cards and how it works
    #/play/<id>        Play: live camera preview, 10 slots, reveal and place
    #/result           Result: final ranking and share
    #/diagnostics      Diagnostics: modules, browser checks, self-tests (also #tests)

  FILE LAYOUT (search for the markers; each one is a future file)
    STYLES               becomes src/styles.css
    PACKS                becomes packs/<id>.json (bundled category data)
    KERNEL               module registry and dependency rules (stays in the app entry)
    MODULE: <name>       becomes src/<name>/index.js (shared, content, core, storage, camera,
                         tracking, compositor, recorder, results, ui)
    TESTS                becomes tests/*.js
    BOOTSTRAP            becomes src/main.js

  MODULES AND DEPENDENCY RULES (enforced at runtime by the KERNEL)
    shared      no dependencies   config, environment detection, helpers
    content     shared            category packs, items, item images (data, not code)
    core        shared, content   game engine, pure logic, no DOM
    storage     shared            persistence, offline layer, pack downloads
    camera      shared            camera stream and permissions
    tracking    shared            face/head tracking tiers, smoothing
    compositor  shared            canvas drawing: camera, item, board
    recorder    shared            canvas capture, optional microphone, save and share
    results     shared, core, content   result card generation
    ui          all of the above  screens, navigation, theming

  CONTENT PACKS
    A pack is JSON (schema 1): id, version, name, icon, accent, items[{id, name, image}].
    Item images are a union by type: text (monogram), flag (ISO country code). New types
    (licensed, user) are added by registering a renderer in the ui module. The game engine
    never looks at images. New packs can be registered at runtime with catalog.register().
    v1 uses text cards and flags only. No copyrighted player photos.

  CONVENTIONS
    1. A module is registry.define(name, deps, factory). The factory receives ONLY the
       dependencies it declared and returns a frozen public API.
    2. Module internals stay inside the factory. Never reach into another module.
    3. Build DOM with textContent or element APIs. Never inject HTML strings.
    4. Add a self-test for every new behavior. Never delete an existing test.
    5. No external scripts, styles, fonts, images or network calls (see the CSP below).
       Anything that needs the network must say so here and relax the CSP deliberately.
    6. Bump version and phase in the config, and add a changelog line below.

  MIGRATION TO A MULTI-FILE PROJECT (later step)
    Split on the marker comments. Each module factory becomes
    export default function create(deps) {...}, and the registry stays in the entry file.
    The previous Vite/Svelte scaffold is kept in _archive/step1-vite-scaffold.

  CAMERA (v0.3.0)
    The camera module owns the stream (a controller with start, stop, switch, subscribe and
    dispose). The Play screen creates one controller per visit. It is released when the player
    taps Stop, leaves the screen (the router calls destroy), hides the page, or sends the
    browser to the background. The camera never starts by itself: the player taps Start camera.
    The preview is a plain video element (hardware decoded, no canvas copy). Capture profile
    for budget phones: 640x480 ideal, 24 fps ideal with a 30 fps cap, audio off, front camera
    first. The front preview is mirrored like a selfie, so face tracking (a later step) must
    account for that. Errors are mapped to plain-language messages (camera module ERRORS).
    Long explanations go in the note under the stage so they never cover the item card.

  PRIVACY
    No analytics. Camera frames stay in the video element on this device: nothing is copied,
    recorded or sent anywhere, and the page makes no network requests. Microphone audio is
    never requested in this version. Camera and microphone data never leave the device unless
    the user explicitly agrees to an upload feature (none exists).

  CHANGELOG
    0.3.0  Camera integration: live preview replaces the placeholder; Start, Stop and Switch
           camera; friendly permission, device and browser errors; release on leave, hide and
           background; manual Real camera check in Diagnostics; automated tests use a
           simulated camera. No face tracking, no recording, no microphone.
    0.2.0  Steps 3-4 (built before the Step 2 device spike, at the owner's request):
           three starter packs, game engine, result builder, Home/Play/Result screens,
           hash router, diagnostics moved to #/diagnostics. Camera, tracking and
           recording are NOT started: the play stage shows a placeholder.
    0.1.0  Step 1: module registry, ten module shells, config, environment check,
           responsive shell, in-page self-tests.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d12" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src blob: data:; connect-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <title>Blind Ranking</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0d12'/%3E%3Ctext x='32' y='44' font-size='32' font-weight='700' text-anchor='middle' fill='%236ea8ff' font-family='sans-serif'%3E10%3C/text%3E%3C/svg%3E"
    />
    <style>
      /* ===== STYLES (becomes src/styles.css) ===== */
      :root {
        color-scheme: dark;
        --bg: #0b0d12;
        --surface: #141822;
        --surface-2: #1b2130;
        --border: #262d3d;
        --fg: #f2f4f8;
        --muted: #9aa4b8;
        --accent: #6ea8ff;
        --ok: #3ecf8e;
        --warn: #f5b14c;
        --bad: #ff6b6b;
        --radius: 16px;
        --font: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        --cat: var(--accent);
        --cat-soft: rgba(110, 168, 255, 0.14);
        --cat-line: rgba(110, 168, 255, 0.45);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        -webkit-text-size-adjust: 100%;
        background: var(--bg);
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.5 var(--font);
        -webkit-tap-highlight-color: transparent;
      }

      h1,
      h2,
      h3,
      p,
      ul,
      ol {
        margin: 0;
      }

      [tabindex='-1']:focus {
        outline: none;
      }

      button {
        font: inherit;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .app {
        min-height: 100vh;
        min-height: 100dvh;
        max-width: 960px;
        margin: 0 auto;
        padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
          max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .main {
        flex: 1;
        min-width: 0;
      }

      /* --- app header and footer --- */
      .header {
        padding-top: 4px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand__mark {
        flex: none;
        width: 44px;
        height: 44px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 1.1rem;
        color: #07101f;
        background: linear-gradient(135deg, var(--accent), #a78bfa);
      }

      .title {
        font-size: clamp(1.25rem, 5vw, 1.75rem);
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.15;
      }

      .tagline {
        color: var(--muted);
        font-size: 0.875rem;
      }

      .footer {
        color: var(--muted);
        font-size: 0.8rem;
        text-align: center;
        padding: 8px 0;
      }

      .app[data-route='play'] .header,
      .app[data-route='play'] .footer {
        display: none;
      }

      /* --- screens --- */
      .screen {
        display: flex;
        flex-direction: column;
        gap: 16px;
        animation: screen-in 0.2s ease-out;
      }

      @keyframes screen-in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      .topbar {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .topbar__title {
        flex: 1;
        min-width: 0;
        font-size: 1.15rem;
        font-weight: 700;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .icon-btn {
        flex: none;
        width: 44px;
        height: 44px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--fg);
        font-size: 1.25rem;
        cursor: pointer;
      }

      .icon-btn:focus-visible,
      .btn:focus-visible,
      .cat:focus-visible,
      .slot:focus-visible,
      .link-btn:focus-visible {
        outline: 3px solid #ffffff;
        outline-offset: 2px;
      }

      .hero {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 4px 0;
      }

      .hero__title {
        font-size: clamp(1.6rem, 7vw, 2.4rem);
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.1;
        background: linear-gradient(90deg, #ffffff, var(--accent));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .section-title {
        font-size: 1rem;
        font-weight: 700;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-size: 0.8rem;
      }

      /* --- home: categories and steps --- */
      .cats {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 12px;
      }

      @media (min-width: 620px) {
        .cats {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
        .cat {
          flex-direction: column;
          align-items: flex-start;
          justify-content: space-between;
          min-height: 150px;
        }
      }

      .cat {
        display: flex;
        align-items: center;
        gap: 14px;
        width: 100%;
        min-height: 76px;
        padding: 14px 16px;
        border-radius: var(--radius);
        border: 1px solid var(--cat-line);
        background: linear-gradient(135deg, var(--cat-soft), var(--surface) 75%);
        color: var(--fg);
        text-align: left;
        cursor: pointer;
      }

      .cat__icon {
        flex: none;
        font-size: 2rem;
        line-height: 1;
      }

      .cat__body {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }

      .cat__name {
        font-size: 1.1rem;
      }

      .cat__go {
        flex: none;
        color: var(--cat);
        font-size: 1.6rem;
        line-height: 1;
      }

      .steps {
        list-style: none;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .step {
        display: flex;
        gap: 12px;
        align-items: flex-start;
      }

      .step__n {
        flex: none;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 0.85rem;
        background: var(--surface-2);
        border: 1px solid var(--border);
        color: var(--accent);
      }

      .step__body {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      .link-btn {
        align-self: center;
        min-height: 44px;
        padding: 0 12px;
        background: none;
        border: 0;
        color: var(--muted);
        text-decoration: underline;
        cursor: pointer;
      }

      /* --- play --- */
      .play {
        gap: 12px;
      }

      .stage {
        position: relative;
        width: 100%;
        aspect-ratio: 4 / 3;
        max-height: 42vh;
        border-radius: var(--radius);
        overflow: hidden;
        border: 1px solid var(--cat-line);
        background:
          radial-gradient(120% 90% at 50% 90%, var(--cat-soft), transparent 62%),
          linear-gradient(180deg, #10141f, #0a0d14);
      }

      .stage__person {
        position: absolute;
        left: 50%;
        bottom: -4%;
        transform: translateX(-50%);
        width: 56%;
        height: 72%;
        color: #1c2334;
      }

      .stage__person svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      .stage__card {
        position: absolute;
        left: 50%;
        top: 6%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 150px;
        max-width: 88%;
        padding: 8px 14px 8px 8px;
        border-radius: 16px;
        background: rgba(20, 24, 34, 0.94);
        border: 1px solid var(--cat-line);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
        z-index: 2;
      }

      .stage__card.pop {
        animation: pop 0.22s ease-out;
      }

      @keyframes pop {
        from {
          transform: translateX(-50%) scale(0.8);
          opacity: 0;
        }
        to {
          transform: translateX(-50%) scale(1);
          opacity: 1;
        }
      }

      .stage__text {
        display: flex;
        flex-direction: column;
        min-width: 0;
        line-height: 1.2;
      }

      .stage__text strong {
        overflow-wrap: anywhere;
      }

      /* --- camera: layers are media (0), item card (2), live chip and controls (3) --- */
      [hidden] {
        display: none !important;
      }

      .stage__media {
        position: absolute;
        inset: 0;
        z-index: 0;
      }

      .stage__video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        background: #000;
      }

      /* The front camera is mirrored like a selfie. Face tracking must account for this later. */
      .stage__video--mirror {
        transform: scaleX(-1);
      }

      .stage__live {
        position: absolute;
        left: 8px;
        top: 8px;
        z-index: 3;
        padding: 2px 6px;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 700;
        color: #ffffff;
        background: rgba(200, 30, 30, 0.88);
      }

      .stage__cam {
        position: absolute;
        inset: 0;
        z-index: 3;
        pointer-events: none;
      }

      .stage__cam > * {
        pointer-events: auto;
      }

      .stage__controls {
        position: absolute;
        right: 8px;
        bottom: 8px;
        display: flex;
        gap: 8px;
      }

      .stage__panel {
        position: absolute;
        left: 8px;
        right: 8px;
        bottom: 8px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 8px 8px 8px 12px;
        border-radius: 14px;
        background: rgba(11, 13, 18, 0.9);
        border: 1px solid var(--border);
      }

      .stage__panel[data-camera-panel='error'] {
        border-color: var(--bad);
      }

      .stage__panel[data-camera-panel='error'] .stage__panel-title {
        color: var(--bad);
      }

      .stage__panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        min-width: 0;
      }

      .stage__panel-title {
        min-width: 0;
        font-size: 0.95rem;
        line-height: 1.2;
        overflow-wrap: anywhere;
      }

      /* Explanation under the stage. It is in the page flow, so it can never cover the item card. */
      .cam-note {
        margin: 8px 2px 0;
        color: var(--muted);
        font-size: 0.85rem;
        line-height: 1.35;
      }

      .cam-note--error {
        color: var(--fg);
      }

      .cam-btn {
        flex: none;
        min-height: 44px;
        padding: 0 14px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: rgba(11, 13, 18, 0.85);
        color: var(--fg);
        font-weight: 700;
        font-size: 0.9rem;
        cursor: pointer;
      }

      .cam-btn--primary {
        background: var(--cat);
        border-color: transparent;
        color: #07101f;
      }

      .cam-btn:focus-visible {
        outline: 3px solid #ffffff;
        outline-offset: 2px;
      }

      /* --- diagnostics: manual camera check --- */
      .check-video {
        width: 100%;
        max-width: 240px;
        aspect-ratio: 4 / 3;
        border-radius: 12px;
        object-fit: cover;
        background: #000;
      }

      .check-video--mirror {
        transform: scaleX(-1);
      }

      .row__value {
        min-width: 0;
        text-align: right;
        font-size: 0.9rem;
        overflow-wrap: anywhere;
      }

      .value--ok {
        color: var(--ok);
      }

      .value--bad {
        color: var(--bad);
      }

      .value--info {
        color: var(--muted);
      }

      .avatar {
        flex: none;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 0.95rem;
        letter-spacing: 0.02em;
        color: #ffffff;
        user-select: none;
      }

      .avatar--sm {
        width: 32px;
        height: 32px;
        font-size: 0.75rem;
      }

      .avatar--flag {
        background: var(--surface-2);
        font-size: 1.5rem;
        letter-spacing: 0;
      }

      .avatar--flag.avatar--sm {
        font-size: 1.1rem;
      }

      .avatar--mystery {
        background: var(--surface-2);
        color: var(--cat);
        font-size: 1.4rem;
      }

      .slots {
        list-style: none;
        padding: 0;
        display: grid;
        grid-template-rows: repeat(5, auto);
        grid-auto-flow: column;
        grid-auto-columns: minmax(0, 1fr);
        gap: 8px;
      }

      .slots > li {
        min-width: 0;
        display: flex;
      }

      .slot {
        flex: 1;
        min-width: 0;
        min-height: 52px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 10px;
        border-radius: 12px;
        border: 1px dashed var(--border);
        background: var(--surface);
        color: var(--muted);
        text-align: left;
        cursor: pointer;
      }

      .slot__rank {
        flex: none;
        width: 28px;
        height: 28px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 0.85rem;
        background: var(--surface-2);
        color: var(--muted);
      }

      .slot__name {
        min-width: 0;
        font-size: 0.875rem;
        line-height: 1.2;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        overflow-wrap: anywhere;
      }

      .slot--ready {
        border-style: solid;
        border-color: var(--cat);
        color: var(--cat);
      }

      .slot--filled {
        border-style: solid;
        border-color: var(--cat-line);
        background: var(--cat-soft);
        color: var(--fg);
      }

      .slot--filled .slot__rank {
        background: var(--cat);
        color: #07101f;
      }

      .slot:disabled {
        cursor: default;
      }

      .actionbar {
        position: sticky;
        bottom: 0;
        z-index: 2;
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 14px 0 max(8px, env(safe-area-inset-bottom));
        background: linear-gradient(180deg, rgba(11, 13, 18, 0), var(--bg) 40%);
      }

      @media (min-width: 760px) {
        .play {
          display: grid;
          grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
          grid-template-areas:
            'top top'
            'stage slots'
            'action action';
          column-gap: 20px;
        }
        .play > .topbar {
          grid-area: top;
        }
        .play > .play__stage {
          grid-area: stage;
        }
        .play > .play__slots {
          grid-area: slots;
        }
        .play > .actionbar {
          grid-area: action;
        }
        .play .stage {
          max-height: none;
        }
        .play .slots {
          grid-template-rows: none;
          grid-auto-flow: row;
          grid-auto-columns: auto;
          grid-template-columns: minmax(0, 1fr);
        }
      }

      /* --- buttons and chips --- */
      .btn {
        min-height: 52px;
        padding: 0 22px;
        border: 0;
        border-radius: 14px;
        background: var(--cat, var(--accent));
        color: #07101f;
        font-weight: 700;
        font-size: 1.05rem;
        cursor: pointer;
        align-self: flex-start;
      }

      .btn--block {
        align-self: stretch;
        width: 100%;
      }

      .btn--ghost {
        background: transparent;
        color: var(--fg);
        border: 1px solid var(--border);
      }

      .btn:disabled {
        opacity: 0.55;
        cursor: default;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .chip {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 999px;
        border: 1px solid var(--border);
        font-size: 0.8rem;
        white-space: nowrap;
        color: var(--muted);
      }

      .chip--ok,
      .chip--ready {
        color: var(--ok);
        border-color: var(--ok);
      }

      .chip--bad {
        color: var(--bad);
        border-color: var(--bad);
      }

      .chip--info,
      .chip--foundation {
        color: var(--accent);
        border-color: var(--accent);
      }

      .hint {
        color: var(--muted);
        font-size: 0.85rem;
        text-align: center;
        min-height: 1.3em;
      }

      .muted {
        color: var(--muted);
        font-size: 0.875rem;
      }

      .mono {
        font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        font-size: 0.75rem;
        color: var(--muted);
        overflow-wrap: anywhere;
      }

      /* --- result --- */
      .ranking {
        list-style: none;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .rank-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 14px;
        border-radius: 12px;
        background: var(--surface);
        border: 1px solid var(--border);
      }

      .rank-row:nth-child(-n + 3) {
        border-color: var(--cat-line);
        background: var(--cat-soft);
      }

      .rank-row__n {
        flex: none;
        width: 28px;
        font-weight: 800;
        color: var(--cat);
        text-align: center;
      }

      .rank-row__name {
        min-width: 0;
        font-weight: 600;
        overflow-wrap: anywhere;
      }

      .status {
        min-height: 1.5em;
        text-align: center;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .result-actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      /* --- diagnostics --- */
      .grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 16px;
        align-content: start;
      }

      @media (min-width: 720px) {
        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .span-2 {
          grid-column: 1 / -1;
        }
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-width: 0;
      }

      .card h3 {
        font-size: 1.05rem;
      }

      .list {
        list-style: none;
        padding: 0;
        display: flex;
        flex-direction: column;
      }

      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 10px 0;
        border-top: 1px solid var(--border);
      }

      .row:first-child {
        border-top: 0;
      }

      .row__main {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      .summary {
        font-weight: 700;
      }

      .summary--ok {
        color: var(--ok);
      }

      .summary--bad {
        color: var(--bad);
      }

      .tests {
        list-style: none;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 0.9rem;
      }

      .tests li {
        display: flex;
        gap: 8px;
        overflow-wrap: anywhere;
      }

      .test--ok {
        color: var(--ok);
      }

      .test--bad {
        color: var(--bad);
      }

      .fatal {
        background: var(--surface);
        border: 1px solid var(--bad);
        border-radius: var(--radius);
        padding: 16px;
      }

      .fatal pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        color: var(--bad);
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }

    <script>
      (function () {
        'use strict';

        /* ===== EARLY ERROR HANDLER (part of BOOTSTRAP): a load failure must be visible ===== */
        window.addEventListener('error', (event) => {
          const root = document.getElementById('app');
          if (root && !root.querySelector('[data-footer]')) {
            renderFatal(root, event.error || event.message);
          }
        });

        /* ===== KERNEL: module registry (stays in the app entry after migration) ===== */

        /**
         * Allowed dependencies per module. The registry refuses anything else.
         * @type {Readonly<Record<string, readonly string[]>>}
         */
        const ARCHITECTURE_RULES = deepFreeze({
          shared: [],
          content: ['shared'],
          core: ['shared', 'content'],
          storage: ['shared'],
          camera: ['shared'],
          tracking: ['shared'],
          compositor: ['shared'],
          recorder: ['shared'],
          results: ['shared', 'core', 'content'],
          ui: [
            'shared',
            'content',
            'core',
            'storage',
            'camera',
            'tracking',
            'compositor',
            'recorder',
            'results',
          ],
        });

        /**
         * Recursively freezes plain objects and arrays.
         * @template T
         * @param {T} value
         * @returns {T}
         */
        function deepFreeze(value) {
          if (value && typeof value === 'object' && !Object.isFrozen(value)) {
            Object.freeze(value);
            for (const key of Object.keys(value)) {
              deepFreeze(value[key]);
            }
          }
          return value;
        }

        /**
         * Creates a module registry that enforces a dependency rule table.
         * @param {Readonly<Record<string, readonly string[]>>} allowed module name to allowed deps
         */
        function createRegistry(allowed) {
          /** @type {Map<string, {name: string, deps: string[], factory: Function}>} */
          const definitions = new Map();
          /** @type {Map<string, Readonly<Record<string, unknown>>>} */
          const instances = new Map();
          /** @type {string[]} */
          const resolving = [];

          /**
           * @param {string} name
           * @param {string[]} deps
           * @param {(deps: Readonly<Record<string, any>>) => Record<string, unknown>} factory
           */
          function define(name, deps, factory) {
            if (!Object.prototype.hasOwnProperty.call(allowed, name)) {
              throw new Error(`Unknown module "${name}"`);
            }
            if (definitions.has(name)) {
              throw new Error(`Module "${name}" is already defined`);
            }
            if (typeof factory !== 'function') {
              throw new Error(`Module "${name}" needs a factory function`);
            }
            for (const dep of deps) {
              if (!allowed[name].includes(dep)) {
                throw new Error(`Module "${name}" must not depend on "${dep}"`);
              }
            }
            definitions.set(name, { name, deps: [...deps], factory });
          }

          /** @param {string} name */
          function resolve(name) {
            const existing = instances.get(name);
            if (existing) {
              return existing;
            }
            const definition = definitions.get(name);
            if (!definition) {
              throw new Error(`Module "${name}" is not defined`);
            }
            if (resolving.includes(name)) {
              throw new Error(`Circular dependency: ${[...resolving, name].join(' > ')}`);
            }
            resolving.push(name);
            try {
              /** @type {Record<string, unknown>} */
              const injected = {};
              for (const dep of definition.deps) {
                injected[dep] = resolve(dep);
              }
              const api = definition.factory(Object.freeze(injected));
              if (!api || typeof api !== 'object') {
                throw new Error(`Module "${name}" must return an object`);
              }
              const frozen = Object.freeze(api);
              instances.set(name, frozen);
              return frozen;
            } finally {
              resolving.pop();
            }
          }

          /** Resolves every module named in the rule table. */
          function boot() {
            for (const name of Object.keys(allowed)) {
              resolve(name);
            }
          }

          /** @returns {{name: string, deps: string[]}[]} */
          function list() {
            return [...definitions.values()].map(({ name, deps }) => ({ name, deps: [...deps] }));
          }

          return Object.freeze({ define, get: resolve, boot, list });
        }

        const registry = createRegistry(ARCHITECTURE_RULES);

        /* ===== END KERNEL ===== */

        /* ===== MODULE: shared | target: src/shared/index.js ===== */
        registry.define('shared', [], () => {
          const config = deepFreeze({
            app: {
              name: 'Blind Ranking',
              version: '0.3.0',
              phase: 'Camera integration',
              buildDate: '2026-10-31',
            },
            game: { slotCount: 10 },
            platform: { minAndroid: 10, referenceDevices: ['Realme C15', 'Realme C25Y'] },
          });

          const MODULE_STATUSES = ['ready', 'foundation', 'planned'];

          /**
           * Describes a module for the diagnostics screen. Every module exposes one as `meta`.
           * @param {string} name
           * @param {'ready'|'foundation'|'planned'} status
           * @param {number} step roadmap step that implements (or finishes) the module
           * @param {string} description
           */
          function moduleMeta(name, status, step, description) {
            if (!MODULE_STATUSES.includes(status)) {
              throw new Error(`Invalid module status "${status}"`);
            }
            return Object.freeze({ name, status, step, description });
          }

          /**
           * Runs a probe and returns its result, or a fallback if it throws.
           * @template T
           * @param {() => T} probe
           * @param {T} fallback
           * @returns {T}
           */
          function attempt(probe, fallback) {
            try {
              return probe();
            } catch (_error) {
              return fallback;
            }
          }

          /**
           * Reads browser capabilities. Never throws and never asks for permissions.
           * @param {any} [win] window-like object (a stub in tests)
           */
          function detectEnv(win = window) {
            const yes = (probe) => attempt(() => Boolean(probe()), false);
            return Object.freeze({
              protocol: attempt(() => String(win.location.protocol), 'unknown'),
              userAgent: attempt(() => String(win.navigator.userAgent), 'unknown'),
              secureContext: yes(() => win.isSecureContext),
              online: yes(() => win.navigator.onLine),
              getUserMedia: yes(() => typeof win.navigator.mediaDevices.getUserMedia === 'function'),
              mediaRecorder: yes(() => typeof win.MediaRecorder === 'function'),
              captureStream: yes(
                () => typeof win.HTMLCanvasElement.prototype.captureStream === 'function',
              ),
              faceDetector: yes(() => typeof win.FaceDetector === 'function'),
              webAssembly: yes(() => typeof win.WebAssembly === 'object'),
              localStorage: yes(() => {
                const key = '__br_probe__';
                win.localStorage.setItem(key, '1');
                win.localStorage.removeItem(key);
                return true;
              }),
              indexedDB: yes(() => win.indexedDB !== null && typeof win.indexedDB === 'object'),
            });
          }

          return {
            meta: moduleMeta('shared', 'ready', 1, 'Config, environment detection, helpers.'),
            config,
            moduleMeta,
            detectEnv,
          };
        });
        /* ===== END MODULE: shared ===== */

        /* ===== MODULE: content | target: src/content/index.js ===== */
        registry.define('content', ['shared'], ({ shared }) => {
          const HEX_COLOR = /^#[0-9a-fA-F]{6}$/;
          const SLUG = /^[a-z0-9-]+$/;

          /**
           * Lists every problem found in a pack. An empty list means the pack is valid.
           * @param {any} pack
           * @param {number} minItems
           * @returns {string[]}
           */
          function packErrors(pack, minItems) {
            const errors = [];
            if (!pack || typeof pack !== 'object') {
              return ['pack must be an object'];
            }
            if (pack.schema !== 1) {
              errors.push('schema must be 1');
            }
            if (typeof pack.id !== 'string' || !SLUG.test(pack.id)) {
              errors.push('id must be a lowercase slug');
            }
            if (typeof pack.name !== 'string' || pack.name.trim() === '') {
              errors.push('name is required');
            }
            if (!Number.isInteger(pack.version) || pack.version < 1) {
              errors.push('version must be a positive integer');
            }
            if (pack.accent !== undefined && !HEX_COLOR.test(String(pack.accent))) {
              errors.push('accent must be a #rrggbb color');
            }
            if (!Array.isArray(pack.items)) {
              errors.push('items must be a list');
              return errors;
            }
            if (pack.items.length < minItems) {
              errors.push(`needs at least ${minItems} items (has ${pack.items.length})`);
            }
            const seen = new Set();
            pack.items.forEach((item, index) => {
              const label = `item ${index + 1}`;
              if (!item || typeof item !== 'object') {
                errors.push(`${label} must be an object`);
                return;
              }
              if (typeof item.id !== 'string' || !SLUG.test(item.id)) {
                errors.push(`${label} needs a slug id`);
              } else if (seen.has(item.id)) {
                errors.push(`${label} repeats id "${item.id}"`);
              } else {
                seen.add(item.id);
              }
              if (typeof item.name !== 'string' || item.name.trim() === '') {
                errors.push(`${label} needs a name`);
              }
              if (item.image !== undefined) {
                if (!item.image || typeof item.image.type !== 'string') {
                  errors.push(`${label} image needs a type`);
                } else if (item.image.type === 'flag' && !/^[A-Za-z]{2}$/.test(item.image.code)) {
                  errors.push(`${label} flag image needs a 2-letter code`);
                }
              }
            });
            return errors;
          }

          /**
           * Throws if the pack is invalid.
           * @param {any} pack
           * @param {number} [minItems] defaults to the number of ranking slots
           */
          function validatePack(pack, minItems = shared.config.game.slotCount) {
            const errors = packErrors(pack, minItems);
            if (errors.length > 0) {
              const id = pack && typeof pack.id === 'string' ? pack.id : '?';
              throw new Error(`Invalid pack "${id}": ${errors.join('; ')}`);
            }
          }

          /** Fills defaults and freezes a validated pack. @param {any} pack */
          function normalizePack(pack) {
            const fallbackImage = pack.defaultImage || { type: 'text' };
            return deepFreeze({
              id: pack.id,
              name: pack.name.trim(),
              version: pack.version,
              order: typeof pack.order === 'number' ? pack.order : 100,
              icon: pack.icon || '★',
              accent: pack.accent || '#6ea8ff',
              tagline: pack.tagline || '',
              items: pack.items.map((item) => ({
                id: item.id,
                name: item.name.trim(),
                image: item.image || fallbackImage,
              })),
            });
          }

          /**
           * A catalog holds installed packs. New packs (downloaded later) use register().
           * @param {any[]} [initialPacks]
           */
          function createCatalog(initialPacks = []) {
            /** @type {Map<string, any>} */
            const packs = new Map();

            /** @param {any} pack */
            function register(pack) {
              validatePack(pack);
              const existing = packs.get(pack.id);
              if (existing && existing.version >= pack.version) {
                throw new Error(
                  `Pack "${pack.id}" version ${existing.version} is already installed`,
                );
              }
              packs.set(pack.id, normalizePack(pack));
            }

            function categories() {
              return [...packs.values()]
                .sort((a, b) => a.order - b.order || a.name.localeCompare(b.name))
                .map((p) =>
                  Object.freeze({
                    id: p.id,
                    name: p.name,
                    icon: p.icon,
                    accent: p.accent,
                    tagline: p.tagline,
                    version: p.version,
                    itemCount: p.items.length,
                  }),
                );
            }

            /** @param {string} id */
            const get = (id) => packs.get(id) || null;

            initialPacks.forEach(register);
            return Object.freeze({ register, categories, get });
          }

          /**
           * Reads the bundled packs from JSON blocks in the page.
           * @param {Document} [doc]
           */
          function loadBundledPacks(doc = document) {
            return Array.from(doc.querySelectorAll('script[type="application/json"][data-pack]')).map(
              (node) => {
                try {
                  return JSON.parse(node.textContent || '');
                } catch (error) {
