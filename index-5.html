             */
            function hexToRgba(hex, alpha) {
              const value = parseInt(hex.slice(1), 16);
              return `rgba(${(value >> 16) & 255}, ${(value >> 8) & 255}, ${value & 255}, ${alpha})`;
            }

            /**
             * Applies a category accent color to an element and everything inside it.
             * @param {HTMLElement} element
             * @param {string} accent
             */
            function applyAccent(element, accent) {
              element.style.setProperty('--cat', accent);
              element.style.setProperty('--cat-soft', hexToRgba(accent, 0.14));
              element.style.setProperty('--cat-line', hexToRgba(accent, 0.45));
            }

            /* ---------- item images (extend IMAGE_RENDERERS for new image types) ---------- */

            /** @param {{id: string, name: string}} item @param {string} sizeClass */
            function monogram(item, sizeClass) {
              const hue = content.hueFor(item.id);
              const el = h('span', {
                class: `avatar ${sizeClass}`.trim(),
                'aria-hidden': 'true',
                text: content.initials(item.name),
              });
              el.style.background = `linear-gradient(135deg, hsl(${hue}, 62%, 46%), hsl(${(hue + 40) % 360}, 62%, 34%))`;
              return el;
            }

            const IMAGE_RENDERERS = {
              text: monogram,
              /** @param {any} item @param {string} sizeClass */
              flag(item, sizeClass) {
                const emoji = content.flagEmoji(item.image.code);
                if (!emoji) {
                  return monogram(item, sizeClass);
                }
                return h('span', {
                  class: `avatar avatar--flag ${sizeClass}`.trim(),
                  'aria-hidden': 'true',
                  text: emoji,
                });
              },
            };

            /**
             * @param {{id: string, name: string, image?: {type: string}}} item
             * @param {boolean} [small]
             */
            function itemAvatar(item, small = false) {
              const type = item.image && item.image.type;
              const render = IMAGE_RENDERERS[type] || IMAGE_RENDERERS.text;
              return render(item, small ? 'avatar--sm' : '');
            }

            /** Decorative head-and-shoulders outline where the camera preview will go. */
            function personSilhouette() {
              const ns = 'http://www.w3.org/2000/svg';
              const svg = document.createElementNS(ns, 'svg');
              svg.setAttribute('viewBox', '0 0 200 240');
              svg.setAttribute('aria-hidden', 'true');
              const head = document.createElementNS(ns, 'circle');
              head.setAttribute('cx', '100');
              head.setAttribute('cy', '72');
              head.setAttribute('r', '46');
              const body = document.createElementNS(ns, 'path');
              body.setAttribute('d', 'M14 240 C14 170 58 140 100 140 C142 140 186 170 186 240 Z');
              for (const part of [head, body]) {
                part.setAttribute('fill', 'currentColor');
                svg.append(part);
              }
              return svg;
            }

            /* ---------- shared screen parts ---------- */

            /**
             * Back button, title and optional trailing element.
             * @param {string} title
             * @param {{go: (path: string) => void}} env
             * @param {Node} [trailing]
             */
            function topbar(title, env, trailing) {
              return h('div', { class: 'topbar' }, [
                h('button', {
                  class: 'icon-btn',
                  type: 'button',
                  'aria-label': 'Back to home',
                  'data-action': 'back',
                  text: '←',
                  onclick: () => env.go('/'),
                }),
                h('h2', {
                  class: 'topbar__title',
                  'data-screen-title': '',
                  tabindex: -1,
                  text: title,
                }),
                trailing,
              ]);
            }

            /* ---------- HOME ---------- */

            const HOW_IT_WORKS = [
              ['Pick a category', 'Football, cricket, countries. More packs can be added later.'],
              ['Reveal a random pick', 'One item at a time. You cannot skip or peek ahead.'],
              ['Lock it into a slot', `Tap one of the ${config.game.slotCount} slots. Once placed, it is final.`],
              ['Share your ranking', 'See all of them at the end and send the list to friends.'],
            ];

            /** @param {any} env */
            function homeScreen(env) {
              const cards = content.catalog.categories().map((category) => {
                const card = h(
                  'button',
                  { class: 'cat', type: 'button', 'data-category': category.id },
                  [
                    h('span', { class: 'cat__icon', 'aria-hidden': 'true', text: category.icon }),
                    h('span', { class: 'cat__body' }, [
                      h('strong', { class: 'cat__name', text: category.name }),
                      h('span', {
                        class: 'muted',
                        text: `${category.tagline} · ${category.itemCount} picks`,
                      }),
                    ]),
                    h('span', { class: 'cat__go', 'aria-hidden': 'true', text: '›' }),
                  ],
                );
                applyAccent(card, category.accent);
                card.addEventListener('click', () => env.go(`/play/${category.id}`));
                return card;
              });

              const element = h('section', { class: 'screen', 'data-screen': 'home' }, [
                h('div', { class: 'hero' }, [
                  h('h2', {
                    class: 'hero__title',
                    'data-screen-title': '',
                    tabindex: -1,
                    text: 'Rank blind. No take-backs.',
                  }),
                  h('p', {
                    class: 'muted',
                    text: `Reveal one random pick at a time and lock it into one of ${config.game.slotCount} slots before you see the next.`,
                  }),
                ]),
                h('h3', { class: 'section-title', text: 'Pick a category' }),
                h('div', { class: 'cats' }, cards),
                h('h3', { class: 'section-title', text: 'How it works' }),
                h(
                  'ol',
                  { class: 'steps' },
                  HOW_IT_WORKS.map(([title, text], index) =>
                    h('li', { class: 'step', 'data-how-step': index + 1 }, [
                      h('span', { class: 'step__n', 'aria-hidden': 'true', text: String(index + 1) }),
                      h('span', { class: 'step__body' }, [
                        h('strong', { text: title }),
                        h('span', { class: 'muted', text }),
                      ]),
                    ]),
                  ),
                ),
                h('button', {
                  class: 'link-btn',
                  type: 'button',
                  'data-action': 'diagnostics',
                  text: 'Diagnostics',
                  onclick: () => env.go('/diagnostics'),
                }),
              ]);
              return { element };
            }

            /* ---------- PLAY ---------- */

            /** @param {any} env @param {string} categoryId */
            function playScreen(env, categoryId) {
              const category = content.catalog.get(categoryId);
              const slotCount = config.game.slotCount;
              const game = core.createGame({ items: category.items, slotCount, rng: env.rng });

              const progress = h('span', {
                class: 'chip chip--info',
                'data-progress': '',
                text: `0 / ${slotCount}`,
              });
              const live = h('p', { class: 'sr-only', 'aria-live': 'polite', 'data-live': '' });
              const stageCard = h('div', { class: 'stage__card', 'data-stage-card': '' });
              const hint = h('p', { class: 'hint', 'data-hint': '' });
              const primary = h('button', {
                class: 'btn btn--block',
                type: 'button',
                'data-action': 'primary',
              });

              /** @type {{button: HTMLButtonElement, name: HTMLElement}[]} */
              const slotEls = [];
              const slotList = h('ol', { class: 'slots', 'aria-label': 'Ranking slots' });
              for (let i = 0; i < slotCount; i += 1) {
                const name = h('span', { class: 'slot__name' });
                const button = h('button', { class: 'slot', type: 'button', 'data-slot': i }, [
                  h('span', { class: 'slot__rank', 'aria-hidden': 'true', text: String(i + 1) }),
                  name,
                ]);
                button.addEventListener('click', () => {
                  const item = game.snapshot().current;
                  try {
                    game.place(i);
                    live.textContent = `${item.name} placed in slot ${i + 1}.`;
                  } catch (_error) {
                    /* the button state already prevents invalid placements */
                  }
                });
                slotEls.push({ button, name });
                slotList.append(h('li', {}, [button]));
              }

              function finish() {
                const snap = game.snapshot();
                env.session.result = results.buildResult({
                  category,
                  slots: snap.slots,
                  createdAt: env.now(),
                });
                env.go('/result');
              }

              primary.addEventListener('click', () => {
                const phase = game.snapshot().phase;
                if (phase === 'idle') {
                  const item = game.reveal();
                  live.textContent = `Revealed ${item.name}. Choose a slot.`;
                } else if (phase === 'complete') {
                  finish();
                }
              });

              let lastPhase = 'idle';

              /** @param {ReturnType<typeof game.snapshot>} snap */
              function update(snap) {
                progress.textContent = `${snap.placed} / ${snap.slotCount}`;

                stageCard.className =
                  snap.phase === 'revealed' && lastPhase !== 'revealed'
                    ? 'stage__card pop'
                    : 'stage__card';
                if (snap.phase === 'revealed') {
                  stageCard.replaceChildren(
                    itemAvatar(snap.current),
                    h('div', { class: 'stage__text' }, [
                      h('strong', { 'data-stage-name': '', text: snap.current.name }),
                      h('span', { class: 'muted', text: 'Choose a slot' }),
                    ]),
                  );
                } else if (snap.phase === 'complete') {
                  stageCard.replaceChildren(
                    h('span', { class: 'avatar avatar--mystery', 'aria-hidden': 'true', text: '✓' }),
                    h('div', { class: 'stage__text' }, [
                      h('strong', { text: 'Ranking complete' }),
                      h('span', { class: 'muted', text: `All ${snap.slotCount} placed` }),
                    ]),
                  );
                } else {
                  stageCard.replaceChildren(
                    h('span', { class: 'avatar avatar--mystery', 'aria-hidden': 'true', text: '?' }),
                    h('div', { class: 'stage__text' }, [
                      h('strong', { text: 'Mystery pick' }),
                      h('span', { class: 'muted', text: 'Tap Reveal' }),
                    ]),
                  );
                }

                slotEls.forEach(({ button, name }, index) => {
                  const item = snap.slots[index];
                  const filled = item !== null;
                  const ready = snap.phase === 'revealed' && !filled;
                  button.disabled = !ready;
                  button.classList.toggle('slot--filled', filled);
                  button.classList.toggle('slot--ready', ready);
                  name.textContent = filled ? item.name : ready ? 'Place here' : 'Empty';
                  button.setAttribute(
                    'aria-label',
                    `Slot ${index + 1}: ${filled ? item.name : ready ? 'empty, tap to place' : 'empty'}`,
                  );
                });

                if (snap.phase === 'idle') {
                  primary.disabled = false;
                  primary.textContent = snap.drawn === 0 ? 'Reveal first pick' : 'Reveal next pick';
                  hint.textContent = 'Picks are random and final once placed.';
                } else if (snap.phase === 'revealed') {
                  primary.disabled = true;
                  primary.textContent = 'Tap a slot to place it';
                  hint.textContent = `Where does ${snap.current.name} rank?`;
                } else {
                  primary.disabled = false;
                  primary.textContent = 'See my ranking';
                  hint.textContent = 'Every slot is filled.';
                }
                lastPhase = snap.phase;
              }

              update(game.snapshot());
              game.subscribe(update);

              /* --- camera: live preview, controls and lifecycle ---
                 The camera is optional and never starts by itself: the player taps Start camera.
                 The preview is a plain <video> (hardware decoded; no canvas copy, no network).
                 The front camera preview is mirrored like a selfie. */
              const controller = camera.createController({
                mediaDevices: env.mediaDevices,
                secureContext: env.secureContext,
              });

              const video = h('video', {
                class: 'stage__video',
                playsinline: true,
                autoplay: true,
                disablepictureinpicture: true,
                'aria-label': 'Live camera preview',
                'data-camera-video': '',
              });
              video.muted = true;
              const silhouette = h('div', { class: 'stage__person' }, [personSilhouette()]);
              const mediaLayer = h('div', { class: 'stage__media' }, [silhouette]);
              const liveChip = h('span', {
                class: 'stage__live',
                'data-camera-live': '',
                hidden: true,
                text: '● Live',
              });
              const camLayer = h('div', { class: 'stage__cam', 'data-camera-layer': '' });
              const camNote = h('p', { class: 'cam-note', 'data-camera-note': '', hidden: true });

              /**
               * @param {string} action data-action value
               * @param {string} label visible text
               * @param {() => void} onClick
               * @param {{primary?: boolean, aria?: string}} [options]
               */
              function camButton(action, label, onClick, options = {}) {
                return h('button', {
                  class: `cam-btn${options.primary ? ' cam-btn--primary' : ''}`,
                  type: 'button',
                  'data-action': action,
                  'aria-label': options.aria,
                  text: label,
                  onclick: onClick,
                });
              }

              /**
               * Compact status box over the stage: a title and at most one action. Longer
               * explanations go in the note under the stage, so they can never cover the item card.
               * @param {string} kind idle | starting | error (for tests and styling)
               * @param {string} title
               * @param {Node[]} actions
               */
              function camPanel(kind, title, actions) {
                return h('div', { class: 'stage__panel', 'data-camera-panel': kind }, [
                  h('div', { class: 'stage__panel-head' }, [
                    h('strong', { class: 'stage__panel-title', text: title }),
                    ...actions,
                  ]),
                ]);
              }

              /** @param {ReturnType<typeof controller.snapshot>} snap */
              function cameraOverlay(snap) {
                const start = () => controller.start();
                if (snap.state === 'active') {
                  return [
                    h('div', { class: 'stage__controls' }, [
                      snap.canSwitch
                        ? camButton('camera-switch', 'Switch', () => controller.switchCamera(), {
                            aria: 'Switch camera',
                          })
                        : null,
                      camButton('camera-stop', 'Stop', () => controller.stop(), {
                        aria: 'Stop camera',
                      }),
                    ]),
                  ];
                }
                if (snap.state === 'starting') {
                  return [
                    camPanel('starting', snap.switching ? 'Switching camera…' : 'Starting camera…', [
                      camButton('camera-cancel', 'Cancel', () => controller.stop()),
                    ]),
                  ];
                }
                if (snap.state === 'error' || !snap.supported) {
                  const failure = snap.error || camera.describeError(snap.supportCode);
                  return [
                    camPanel(
                      'error',
                      failure.title,
                      failure.retry
                        ? [camButton('camera-retry', 'Try again', start, { primary: true })]
                        : [],
                    ),
                  ];
                }
                return [
                  camPanel('idle', 'Camera is off', [
                    camButton('camera-start', 'Start camera', start, { primary: true }),
                  ]),
                ];
              }

              /** The explanation shown under the stage for the current camera state. */
              function cameraNote(snap) {
                if (snap.state === 'active') {
                  return snap.notice;
                }
                if (snap.state === 'starting') {
                  return snap.switching ? '' : 'Choose Allow if your browser asks.';
                }
                if (snap.state === 'error' || !snap.supported) {
                  return (snap.error || camera.describeError(snap.supportCode)).message;
                }
                return snap.notice || 'Optional. Stays on this device, never uploaded.';
              }

              /** @param {Node|null} stream */
              function attachPreview(stream) {
                video.srcObject = stream;
                const played = video.play();
                if (played && typeof played.catch === 'function') {
                  played.catch((playError) => {
                    if (playError && playError.name === 'AbortError') {
                      return;
                    }
                    controller.stop({
                      notice: 'The preview could not start. Tap Start camera to try again.',
                    });
                  });
                }
              }

              function detachPreview() {
                if (video.srcObject) {
                  video.pause();
                  video.srcObject = null;
                }
              }

              let lastCameraState = 'idle';

              /** @param {ReturnType<typeof controller.snapshot>} snap */
              function renderCamera(snap) {
                const active = snap.state === 'active';
                if (active) {
                  if (video.srcObject !== snap.stream) {
                    attachPreview(snap.stream);
                  }
                  video.classList.toggle('stage__video--mirror', snap.facing === 'user');
                  if (video.parentNode !== mediaLayer) {
                    mediaLayer.replaceChildren(video);
                  }
                } else {
                  detachPreview();
                  if (silhouette.parentNode !== mediaLayer) {
                    mediaLayer.replaceChildren(silhouette);
                  }
                }
                liveChip.hidden = !active;
                camLayer.replaceChildren(...cameraOverlay(snap));
                const note = cameraNote(snap);
                camNote.textContent = note;
                camNote.hidden = note === '';
                camNote.classList.toggle('cam-note--error', snap.state === 'error' || !snap.supported);

                if (snap.state !== lastCameraState) {
                  if (active) {
                    live.textContent = 'Camera is on.';
                  } else if (snap.state === 'error') {
                    live.textContent = `${snap.error.title}. ${snap.error.message}`;
                  } else if (snap.state === 'idle' && lastCameraState !== 'idle') {
                    live.textContent = 'Camera is off.';
                  }
                  lastCameraState = snap.state;
                }
              }

              controller.subscribe(renderCamera);
              renderCamera(controller.snapshot());

              /** The camera must never keep running while the app is out of sight. */
              function onVisibility() {
                const state = controller.snapshot().state;
                if (
                  document.visibilityState === 'hidden' &&
                  (state === 'active' || state === 'starting')
                ) {
                  controller.stop({ notice: 'Camera turned off while the app was in the background.' });
                }
              }
              function onPageHide() {
                controller.stop();
              }
              document.addEventListener('visibilitychange', onVisibility);
              window.addEventListener('pagehide', onPageHide);

              /** Called by the router before this screen is replaced. Releases the camera. */
              function destroy() {
                document.removeEventListener('visibilitychange', onVisibility);
                window.removeEventListener('pagehide', onPageHide);
                controller.dispose();
                detachPreview();
              }

              const element = h('section', { class: 'screen play', 'data-screen': 'play' }, [
                topbar(`${category.icon} ${category.name}`, env, progress),
                h('div', { class: 'play__stage' }, [
                  h('div', { class: 'stage' }, [mediaLayer, liveChip, stageCard, camLayer]),
                  camNote,
                ]),
                h('div', { class: 'play__slots' }, [slotList]),
                h('div', { class: 'actionbar' }, [primary, hint]),
                live,
              ]);
              applyAccent(element, category.accent);
              return { element, game, controller, destroy };
            }

            /* ---------- RESULT ---------- */

            /**
             * Shares text with the Web Share API, or copies it as a fallback.
             * @param {{title: string, text: string}} payload
             * @returns {Promise<'shared'|'copied'|'cancelled'|'unavailable'>}
             */
            async function shareText(payload) {
              const nav = window.navigator;
              if (typeof nav.share === 'function') {
                try {
                  await nav.share(payload);
                  return 'shared';
                } catch (error) {
                  if (error && error.name === 'AbortError') {
                    return 'cancelled';
                  }
                }
              }
              if (nav.clipboard && typeof nav.clipboard.writeText === 'function') {
                try {
                  await nav.clipboard.writeText(payload.text);
                  return 'copied';
                } catch (_error) {
                  /* fall through to unavailable */
                }
              }
              return 'unavailable';
            }

            /** @param {any} env */
            function resultScreen(env) {
              const result = env.session.result;
              const status = h('p', {
                class: 'status',
                'aria-live': 'polite',
                'data-share-status': '',
              });
              const shareBtn = h('button', {
                class: 'btn btn--block',
                type: 'button',
                'data-action': 'share',
                text: 'Share ranking',
              });
              shareBtn.addEventListener('click', async () => {
                shareBtn.disabled = true;
                const outcome = await env.share({
                  title: `${config.app.name} · ${result.categoryName}`,
                  text: results.toShareText(result),
                });
                status.textContent = SHARE_MESSAGES[outcome] || '';
                shareBtn.disabled = false;
              });

              const element = h('section', { class: 'screen', 'data-screen': 'result' }, [
                h('div', { class: 'hero' }, [
                  h('h2', {
                    class: 'hero__title',
                    'data-screen-title': '',
                    tabindex: -1,
                    text: 'Your ranking',
                  }),
                  h('div', { class: 'chips' }, [
                    chip('info', `${result.icon} ${result.categoryName}`),
                    chip('ok', `${result.entries.length} picks`),
                  ]),
                ]),
                h(
                  'ol',
                  { class: 'ranking' },
                  result.entries.map((entry) =>
                    h('li', { class: 'rank-row', 'data-rank-row': entry.rank }, [
                      h('span', { class: 'rank-row__n', text: String(entry.rank) }),
                      itemAvatar({ id: entry.itemId, name: entry.name, image: entry.image }, true),
                      h('span', { class: 'rank-row__name', text: entry.name }),
                    ]),
                  ),
                ),
                h('div', { class: 'result-actions' }, [
                  shareBtn,
                  status,
                  h('button', {
                    class: 'btn btn--block btn--ghost',
                    type: 'button',
                    'data-action': 'again',
                    text: 'Play again',
                    onclick: () => env.go(`/play/${result.categoryId}`),
                  }),
                  h('button', {
                    class: 'btn btn--block btn--ghost',
                    type: 'button',
                    'data-action': 'home',
                    text: 'Home',
                    onclick: () => env.go('/'),
                  }),
                ]),
              ]);
              applyAccent(element, result.accent);
              return { element };
            }

            /* ---------- DIAGNOSTICS ---------- */

            /**
             * @param {string} label
             * @param {boolean} value
             * @param {boolean} [required] a missing optional capability is shown neutral
             */
            function capabilityRow(label, value, required = true) {
              const chipEl = value ? chip('ok', 'Yes') : chip(required ? 'bad' : 'planned', 'No');
              return h('li', { class: 'row' }, [h('span', { text: label }), chipEl]);
            }

            function environmentCard() {
              const env = shared.detectEnv();
              return h('section', { class: 'card', 'aria-labelledby': 'env-title' }, [
                h('h3', { id: 'env-title', text: 'This browser' }),
                h('ul', { class: 'list', 'data-env': '' }, [
                  h('li', { class: 'row' }, [
                    h('span', { text: 'Page address type' }),
                    chip('info', env.protocol),
                  ]),
                  capabilityRow('Secure context (HTTPS)', env.secureContext),
                  capabilityRow('Online', env.online, false),
                  capabilityRow('Camera API', env.getUserMedia),
                  capabilityRow('Video recording', env.mediaRecorder),
                  capabilityRow('Canvas capture', env.captureStream),
                  capabilityRow('Built-in face detector', env.faceDetector, false),
                  capabilityRow('WebAssembly', env.webAssembly),
                  capabilityRow('Local storage', env.localStorage),
                  capabilityRow('IndexedDB', env.indexedDB),
                ]),
                h('p', {
                  class: 'muted',
                  text: 'Camera features need a secure context: HTTPS or localhost. Nothing here asks for permissions.',
                }),
                h('p', { class: 'mono', text: env.userAgent }),
              ]);
            }

            /** @param {{name: string, status: string, step: number, description: string}} m */
            function moduleRow(m) {
              const label =
                m.status === 'ready'
                  ? 'Ready'
                  : m.status === 'foundation'
                    ? `Partial · Step ${m.step}`
                    : `Step ${m.step}`;
              return h('li', { class: 'row', 'data-module-row': m.name }, [
                h('div', { class: 'row__main' }, [
                  h('strong', { text: m.name }),
                  h('span', { class: 'muted', text: m.description }),
                ]),
                chip(m.status, label),
              ]);
            }

            function modulesCard() {
              const metas = MODULE_ORDER.map((name) => (name === 'ui' ? meta : deps[name].meta));
              return h('section', { class: 'card', 'aria-labelledby': 'modules-title' }, [
                h('h3', { id: 'modules-title', text: 'Modules' }),
                h('ul', { class: 'list' }, metas.map(moduleRow)),
              ]);
            }

            /** @param {{runTests: () => Promise<any>}} hooks */
            function testsCard(hooks) {
              const output = h('div', { 'aria-live': 'polite', 'data-test-output': '' });
              const button = h('button', { class: 'btn', type: 'button', text: 'Run self-tests' });

              /** @param {{total: number, passed: number, failed: number, results: any[]}} result */
              function show(result) {
                const bad = result.failed > 0;
                output.replaceChildren(
                  h('p', {
                    class: `summary summary--${bad ? 'bad' : 'ok'}`,
                    text: `${result.passed} of ${result.total} tests passed`,
                  }),
                  h(
                    'ul',
                    { class: 'tests' },
                    result.results.map((r) =>
                      h('li', { class: r.ok ? 'test--ok' : 'test--bad' }, [
                        h('span', { text: r.ok ? '✓' : '✗' }),
                        h('span', { text: r.ok ? r.name : `${r.name}: ${r.error}` }),
                      ]),
                    ),
                  ),
                );
              }

              button.addEventListener('click', async () => {
                button.disabled = true;
                button.textContent = 'Running…';
                try {
                  show(await hooks.runTests());
                } finally {
                  button.disabled = false;
                  button.textContent = 'Run self-tests';
                }
              });

              const card = h('section', { class: 'card span-2', 'aria-labelledby': 'tests-title' }, [
                h('h3', { id: 'tests-title', text: 'Automated self-tests' }),
                h('p', {
                  class: 'muted',
                  text: 'Run on any device with a simulated camera, so they do not test your real camera (use the manual check above for that). They cover the module rules, game engine, packs, camera logic, screens and page. Add #tests to the address to run them on load.',
                }),
                button,
                output,
              ]);
              return { card, show };
            }

            /** Resolves true when the video shows its first frame, false after the timeout. */
            function waitForFirstFrame(videoEl, timeoutMs) {
              return new Promise((resolve) => {
                if (videoEl.readyState >= 2) {
                  resolve(true);
                  return;
                }
                const onData = () => done(true);
                const timer = setTimeout(() => done(false), timeoutMs);
                function done(value) {
                  clearTimeout(timer);
                  videoEl.removeEventListener('loadeddata', onData);
                  resolve(value);
                }
                videoEl.addEventListener('loadeddata', onData);
              });
            }

            /**
             * Manual check that needs a real camera. It reports what the device actually
             * delivers and proves the camera is released again. Runs only when tapped.
             * @param {any} env
             */
            function cameraCheckCard(env) {
              const status = h('p', {
                class: 'muted',
                'aria-live': 'polite',
                'data-camera-check-status': '',
                text: 'Not run yet.',
              });
              const results = h('ul', { class: 'list', 'data-camera-check-results': '' });
              const preview = h('video', {
                class: 'check-video',
                playsinline: true,
                autoplay: true,
                hidden: true,
                'aria-label': 'Camera check preview',
                'data-camera-check-video': '',
              });
              preview.muted = true;
              const button = h('button', {
                class: 'btn',
                type: 'button',
                'data-action': 'camera-check',
                text: 'Run camera check',
              });
              /** @type {ReturnType<typeof camera.createController>|null} */
              let controller = null;
              let running = false;
              let disposed = false;

              /** @param {string} label @param {string} value @param {'ok'|'bad'|'info'} [kind] */
              function addRow(label, value, kind = 'info') {
                results.append(
                  h('li', { class: 'row' }, [
                    h('span', { text: label }),
                    h('span', { class: `row__value value--${kind}`, text: value }),
                  ]),
                );
              }

              async function run() {
                if (running) {
                  return;
                }
                running = true;
                button.disabled = true;
                button.textContent = 'Checking…';
                results.replaceChildren();
                status.textContent = 'Opening the camera. Choose Allow if your browser asks.';
                controller = camera.createController({
                  mediaDevices: env.mediaDevices,
                  secureContext: env.secureContext,
                });
                let stream = null;
                try {
                  const secure = env.secureContext !== false;
                  addRow('Secure page (HTTPS)', secure ? 'Yes' : 'No', secure ? 'ok' : 'bad');
                  addRow('Permission before check', await camera.queryPermission(env.permissions));
                  const openedAt = performance.now();
                  const opened = await controller.start();
                  const snap = controller.snapshot();
                  if (disposed) {
                    return;
                  }
                  if (!opened) {
                    const failure = snap.error || camera.describeError(snap.supportCode);
                    addRow('Result', failure.title, 'bad');
                    addRow('What to do', failure.message);
                    if (failure.detail) {
                      addRow('Browser error', failure.detail);
                    }
                    status.textContent = 'The camera could not be opened.';
                    return;
                  }
                  stream = snap.stream;
                  addRow(
                    'Camera opened in',
                    `${Math.round(performance.now() - openedAt)} ms (includes any permission prompt)`,
                    'ok',
                  );
                  preview.classList.toggle('check-video--mirror', snap.facing === 'user');
                  preview.hidden = false;
                  preview.srcObject = stream;
                  const playedAt = performance.now();
                  const played = preview.play();
                  if (played && typeof played.catch === 'function') {
                    played.catch(() => {});
                  }
                  const gotFrame = await waitForFirstFrame(preview, 6000);
                  addRow(
                    'First video frame',
                    gotFrame ? `${Math.round(performance.now() - playedAt)} ms` : 'No frame within 6 seconds',
                    gotFrame ? 'ok' : 'bad',
                  );
                  const s = snap.settings;
                  const width = preview.videoWidth || s.width;
                  const height = preview.videoHeight || s.height;
                  addRow('Picture size', width && height ? `${width} × ${height}` : 'unknown');
                  addRow(
                    'Reported frame rate',
                    s.frameRate ? `${Math.round(s.frameRate)} fps` : 'not reported',
                  );
                  if (gotFrame) {
                    const fps = await camera.measureFrameRate(preview, env.fpsWindowMs || 1500);
                    addRow(
                      'Measured frame rate',
                      fps === null ? 'not supported by this browser' : `${fps.toFixed(1)} fps`,
                      fps === null ? 'info' : fps >= 20 ? 'ok' : fps >= 12 ? 'info' : 'bad',
                    );
                  }
                  addRow(
                    'Camera in use',
                    `${snap.facing === 'user' ? 'front' : 'back'}${s.label ? ` · ${s.label}` : ''}`,
                  );
                  addRow('Cameras found', String(snap.cameraCount));
                  addRow('Switch camera available', snap.canSwitch ? 'Yes' : 'No');
                } catch (checkError) {
                  addRow('Unexpected error', String((checkError && checkError.message) || checkError), 'bad');
                } finally {
                  controller.stop();
                  preview.pause();
                  preview.srcObject = null;
                  preview.hidden = true;
                  if (stream) {
                    const released = stream.getTracks().every((track) => track.readyState === 'ended');
                    addRow('Camera released afterwards', released ? 'Yes' : 'No', released ? 'ok' : 'bad');
                  }
                  if (!status.textContent.startsWith('The camera could not')) {
                    status.textContent = 'Check finished. The camera is off.';
                  }
                  button.disabled = false;
                  button.textContent = 'Run camera check';
                  running = false;
                }
              }

              button.addEventListener('click', run);

              /** Releases the camera if the player leaves Diagnostics mid-check. */
              function dispose() {
                disposed = true;
                if (controller) {
                  controller.dispose();
                }
                preview.srcObject = null;
              }

              const card = h(
                'section',
                { class: 'card span-2', 'data-camera-check': '', 'aria-labelledby': 'camcheck-title' },
                [
                  h('h3', { id: 'camcheck-title', text: 'Real camera check (manual)' }),
                  h('p', {
                    class: 'muted',
                    text: 'Needs a real camera, so it only runs when you tap the button. It opens your camera, measures what the phone delivers, then turns the camera off. Nothing is recorded or uploaded.',
                  }),
                  button,
                  status,
                  preview,
                  results,
                ],
              );
              return { card, dispose };
            }

            /** @param {any} env @param {{autorunTests?: boolean}} route */
            function diagnosticsScreen(env, route) {
              const tests = testsCard(env.hooks);
              const cameraCheck = cameraCheckCard(env);
              const element = h('section', { class: 'screen', 'data-screen': 'diagnostics' }, [
                topbar('Diagnostics', env),
                h('div', { class: 'grid' }, [
                  modulesCard(),
                  environmentCard(),
                  cameraCheck.card,
                  tests.card,
                ]),
              ]);
              const afterMount = route.autorunTests
                ? async () => tests.show(await env.hooks.runTests())
                : undefined;
              return { element, afterMount, destroy: cameraCheck.dispose };
            }

            /* ---------- routing ---------- */

            /**
             * Turns a location hash into a route. Never throws.
             * @param {string} hash
             * @returns {{name: 'home'|'play'|'result'|'diagnostics', categoryId?: string, autorunTests?: boolean}}
             */
            function parseRoute(hash) {
              const path = String(hash || '').replace(/^#/, '');
              if (path === 'tests') {
                return { name: 'diagnostics', autorunTests: true };
              }
              const parts = path.split('/').filter(Boolean);
              if (parts[0] === 'play' && parts[1]) {
                let categoryId = parts[1];
                try {
                  categoryId = decodeURIComponent(parts[1]);
                } catch (_error) {
                  /* keep the raw segment; the catalog lookup will reject it */
                }
                return { name: 'play', categoryId };
              }
              if (parts[0] === 'result') {
                return { name: 'result' };
              }
              if (parts[0] === 'diagnostics') {
                return { name: 'diagnostics', autorunTests: false };
              }
              if (parts[0] === 'tests') {
                return { name: 'diagnostics', autorunTests: true };
              }
              return { name: 'home' };
            }

            /** Replaces routes that cannot be shown (unknown category, no result yet) with home. */
            function resolveRoute(route, session) {
              if (route.name === 'play' && !content.catalog.get(route.categoryId)) {
                return { name: 'home' };
              }
              if (route.name === 'result' && !session.result) {
                return { name: 'home' };
              }
              return route;
            }

            /** @param {{name: string}} route @param {any} env */
            function buildScreen(route, env) {
              switch (route.name) {
                case 'play':
                  return playScreen(env, route.categoryId);
                case 'result':
                  return resultScreen(env);
                case 'diagnostics':
                  return diagnosticsScreen(env, route);
                default:
                  return homeScreen(env);
              }
            }

            /**
             * Builds a screen without touching the live page (used by tests).
             * @param {any} route
             * @param {Record<string, any>} [overrides] replaces parts of the screen environment
             */
            function previewScreen(route, overrides = {}) {
              const env = Object.assign(
                {
                  go() {},
                  session: { result: null },
                  hooks: {
                    runTests: async () => ({ total: 0, passed: 0, failed: 0, results: [] }),
                  },
                  rng: Math.random,
                  now: () => new Date(),
                  share: async () => 'unavailable',
                  // Tests never touch the real camera unless they pass their own mediaDevices.
                  mediaDevices: null,
                  secureContext: true,
                  permissions: null,
                  fpsWindowMs: 1500,
                },
                overrides,
              );
              return buildScreen(resolveRoute(route, env.session), env);
            }

            /**
             * Renders the app shell into root and starts the router.
             * @param {HTMLElement} root
             * @param {{runTests: () => Promise<any>}} hooks
             */
            function mount(root, hooks) {
              const { app } = config;
              const session = { result: null };
              const main = h('main', { class: 'main', id: 'main' });
              let currentName = 'home';
              /** @type {{destroy?: () => void}|null} */
              let currentScreen = null;

              function render() {
                const requested = parseRoute(window.location.hash);
                const route = resolveRoute(requested, session);
                if (route.name !== requested.name) {
                  window.history.replaceState(null, '', '#/');
                }
                // Release whatever the old screen holds (the camera) before building the next one.
                if (currentScreen && currentScreen.destroy) {
                  currentScreen.destroy();
                }
                currentScreen = null;
                try {
                  const built = buildScreen(route, env);
                  currentScreen = built;
                  main.replaceChildren(built.element);
                  root.dataset.route = route.name;
                  currentName = route.name;
                  window.scrollTo(0, 0);
                  const title = built.element.querySelector('[data-screen-title]');
                  if (title) {
                    title.focus({ preventScroll: true });
                  }
                  if (built.afterMount) {
                    built.afterMount();
                  }
                } catch (error) {
                  window.__BR_RENDER_ERROR__ = String((error && error.message) || error);
                  main.replaceChildren(
                    h('div', { class: 'fatal' }, [
                      h('h2', { text: 'This screen could not be shown' }),
                      h('pre', { text: window.__BR_RENDER_ERROR__ }),
                      h('button', {
                        class: 'btn',
                        type: 'button',
                        text: 'Back to home',
                        onclick: () => go('/'),
                      }),
                    ]),
                  );
                }
              }

              /** @param {string} path e.g. '/play/football' */
              function go(path) {
                const target = `#${path}`;
                if (window.location.hash === target) {
                  render();
                } else {
                  window.location.hash = target;
                }
              }

              const env = {
                go,
                session,
                hooks,
                rng: Math.random,
                now: () => new Date(),
                share: shareText,
                mediaDevices: window.navigator.mediaDevices,
                secureContext: window.isSecureContext,
                permissions: window.navigator.permissions,
                fpsWindowMs: 1500,
              };

              root.replaceChildren(
                h('header', { class: 'header' }, [
                  h('div', { class: 'brand' }, [
                    h('span', {
                      class: 'brand__mark',
                      'aria-hidden': 'true',
                      text: String(config.game.slotCount),
                    }),
                    h('div', {}, [
                      h('h1', { class: 'title', text: app.name }),
                      h('p', { class: 'tagline', text: 'Blind ranking and challenge' }),
                    ]),
                  ]),
                ]),
                main,
                h('footer', {
                  class: 'footer',
                  'data-footer': '',
                  text: `v${app.version} · ${app.phase} · build ${app.buildDate.replace(/-/g, '‑')}`,
                }),
              );
              window.addEventListener('hashchange', render);
              render();

              return Object.freeze({ go, render, currentScreen: () => currentName });
            }

            return { meta, mount, previewScreen, parseRoute, hexToRgba };
          },
        );
        /* ===== END MODULE: ui ===== */

        /* ===== TESTS (becomes tests/*.js). Add tests for every phase; never delete any. ===== */

        /** @type {{name: string, run: () => (void|Promise<void>)}[]} */
        const TESTS = [];

        /**
         * @param {string} name
         * @param {() => (void|Promise<void>)} run
         */
        function test(name, run) {
          TESTS.push({ name, run });
        }

        /**
         * @param {unknown} condition
         * @param {string} [message]
         */
        function assert(condition, message = 'Assertion failed') {
          if (!condition) {
            throw new Error(message);
          }
        }

        /**
         * @param {unknown} actual
         * @param {unknown} expected
         * @param {string} [message]
         */
        function assertEqual(actual, expected, message = 'Values differ') {
          if (actual !== expected) {
            throw new Error(
              `${message}: expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`,
            );
          }
        }

        /**
         * @param {() => void} fn
         * @param {RegExp} pattern the error message must match
         */
        function assertThrows(fn, pattern) {
          let caught = null;
          try {
            fn();
          } catch (error) {
            caught = error;
          }
          assert(caught, 'Expected the function to throw');
          assert(
            pattern.test(String(caught && caught.message)),
            `Unexpected error message: ${caught && caught.message}`,
          );
        }

        const stub = () => ({});
        const nextTick = () => new Promise((resolve) => setTimeout(resolve, 0));
        const names = (list) => list.map((entry) => entry.name);
        const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

        /** Polls until `check()` returns something truthy; throws after `ms`. */
        async function waitFor(check, what, ms = 2000) {
          const end = Date.now() + ms;
          while (!check()) {
            if (Date.now() > end) {
              throw new Error(`Timed out waiting for ${what}`);
            }
            await sleep(10);
          }
        }

        /** @param {MediaStream} stream true when every track has ended */
        const streamEnded = (stream) => stream.getTracks().every((t) => t.readyState === 'ended');

        /**
         * A SIMULATED camera for automated tests. getUserMedia returns a real MediaStream made
         * from a tiny canvas, so stop(), readyState and the "ended" event behave like a real
         * camera track. It says nothing about real hardware, drivers or permission prompts:
         * those are covered only by the manual camera check in Diagnostics.
         * @param {{cameras?: number, delay?: number}} [options]
         */
        function makeFakeMediaDevices({ cameras = 2, delay = 0 } = {}) {
          const failures = [];
          const calls = [];
          const streams = [];
          const devices = Array.from({ length: cameras }, (_, i) => ({
            kind: 'videoinput',
            deviceId: `cam-${i}`,
            label: i === 0 ? 'Front test camera' : `Back test camera ${i}`,
          }));
          const facingOf = (index) => (index === 0 ? 'user' : 'environment');
          const fail = (name) => new DOMException(`Simulated ${name}`, name);

          return {
            calls,
            streams,
            /** Queues browser error names for the next getUserMedia calls. */
            failNext(...errorNames) {
              failures.push(...errorNames);
            },
            async getUserMedia(constraints) {
              calls.push(constraints);
              if (delay) {
                await sleep(delay);
              }
              const queued = failures.shift();
              if (queued) {
                throw fail(queued);
              }
              const video = constraints.video;
              let index = 0;
              if (video && typeof video === 'object') {
                if (video.deviceId) {
                  index = devices.findIndex((d) => d.deviceId === video.deviceId.exact);
                  if (index < 0) {
                    throw fail('NotFoundError');
                  }
                } else if (video.facingMode) {
                  const wanted = video.facingMode.exact || video.facingMode.ideal;
                  const found = devices.findIndex((_, i) => facingOf(i) === wanted);
                  if (found < 0 && video.facingMode.exact) {
                    throw fail('OverconstrainedError');
                  }
                  index = Math.max(found, 0);
                }
              }
              const canvas = document.createElement('canvas');
              canvas.width = 64;
              canvas.height = 48;
              const context = canvas.getContext('2d');
              let hue = 0;
              const draw = () => {
                hue = (hue + 20) % 360;
                context.fillStyle = `hsl(${hue}, 60%, 50%)`;
                context.fillRect(0, 0, 64, 48);
              };
              draw();
              const timer = setInterval(draw, 40);
              const stream = canvas.captureStream(15);
              const track = stream.getVideoTracks()[0];
              const settings = {
                width: 640,
                height: 480,
                frameRate: 15,
                facingMode: facingOf(index),
                deviceId: devices[index].deviceId,
              };
              track.getSettings = () => settings;
              const realStop = track.stop.bind(track);
              track.stop = () => {
                clearInterval(timer);
                realStop();
              };
              streams.push(stream);
              return stream;
            },
            async enumerateDevices() {
              return devices.map((d) => ({ ...d }));
            },
          };
        }

        /** A minimal valid pack for tests. */
        function samplePack(overrides = {}) {
          return {
            schema: 1,
            id: 'demo',
            version: 1,
            name: 'Demo',
            items: Array.from({ length: 12 }, (_, i) => ({ id: `item-${i}`, name: `Item ${i}` })),
            ...overrides,
          };
        }

        // --- kernel ---
        test('registry rejects an unknown module name', () => {
          const sandbox = createRegistry({ a: [] });
          assertThrows(() => sandbox.define('zzz', [], stub), /Unknown module/);
        });

        test('registry rejects a duplicate definition', () => {
          const sandbox = createRegistry({ a: [] });
          sandbox.define('a', [], stub);
          assertThrows(() => sandbox.define('a', [], stub), /already defined/);
        });

        test('registry rejects a dependency the rules do not allow', () => {
          const sandbox = createRegistry({ a: [], b: [] });
          assertThrows(() => sandbox.define('b', ['a'], stub), /must not depend on "a"/);
        });

        test('registry injects only the declared dependencies', () => {
          const sandbox = createRegistry({ a: [], b: ['a'], c: [] });
          let received = null;
          sandbox.define('a', [], () => ({ value: 1 }));
          sandbox.define('c', [], () => ({ value: 3 }));
          sandbox.define('b', ['a'], (deps) => {
            received = Object.keys(deps);
            return {};
          });
          sandbox.boot();
          assertEqual(JSON.stringify(received), JSON.stringify(['a']), 'Injected keys');
        });

        test('registry freezes module APIs', () => {
          const api = registry.get('shared');
          assert(Object.isFrozen(api), 'shared API should be frozen');
          assertThrows(() => {
            api.config = null;
          }, /read only|Cannot assign|frozen/i);
        });

        test('registry detects circular dependencies', () => {
          const sandbox = createRegistry({ a: ['b'], b: ['a'] });
          sandbox.define('a', ['b'], stub);
          sandbox.define('b', ['a'], stub);
          assertThrows(() => sandbox.boot(), /Circular dependency/);
        });

        test('registry reports a missing module at boot', () => {
          const sandbox = createRegistry({ a: [], b: [] });
          sandbox.define('a', [], stub);
          assertThrows(() => sandbox.boot(), /"b" is not defined/);
        });

        test('registry requires factories to return an object', () => {
          const sandbox = createRegistry({ a: [] });
          sandbox.define('a', [], () => 5);
          assertThrows(() => sandbox.boot(), /must return an object/);
        });

        // --- architecture ---
        test('all ten modules are defined and boot', () => {
          const defined = registry.list().map((m) => m.name);
          assertEqual(defined.length, 10, 'Module count');
          for (const name of Object.keys(ARCHITECTURE_RULES)) {
            assert(defined.includes(name), `Module "${name}" missing`);
            assert(registry.get(name).meta.name === name, `Module "${name}" has wrong meta`);
          }
        });

        test('architecture rules are acyclic and reference only known modules', () => {
          const fresh = createRegistry(ARCHITECTURE_RULES);
          for (const [name, deps] of Object.entries(ARCHITECTURE_RULES)) {
            for (const dep of deps) {
              assert(dep in ARCHITECTURE_RULES, `"${name}" depends on unknown "${dep}"`);
            }
            fresh.define(name, [...deps], stub);
          }
          fresh.boot();
        });

        test('core cannot depend on camera, and shared depends on nothing', () => {
          const fresh = createRegistry(ARCHITECTURE_RULES);
          assertThrows(
            () => fresh.define('core', ['shared', 'content', 'camera'], stub),
            /must not depend on "camera"/,
          );
          assertEqual(ARCHITECTURE_RULES.shared.length, 0, 'shared dependency count');
        });

        test('the real modules declare only dependencies their rules allow', () => {
          for (const { name, deps } of registry.list()) {
            for (const dep of deps) {
              assert(ARCHITECTURE_RULES[name].includes(dep), `${name} -> ${dep} not allowed`);
            }
          }
        });

        // --- shared ---
        test('config has the agreed values and is frozen', () => {
          const { config } = registry.get('shared');
          assertEqual(config.game.slotCount, 10, 'Slot count');
          assertEqual(config.platform.minAndroid, 10, 'Minimum Android');
          assert(/^\d+\.\d+\.\d+$/.test(config.app.version), 'Version should be semver');
          assertThrows(() => {
            config.game.slotCount = 5;
          }, /read only|Cannot assign|frozen/i);
        });

        test('moduleMeta rejects an invalid status', () => {
          const { moduleMeta } = registry.get('shared');
          assertThrows(() => moduleMeta('x', 'done', 1, 'x'), /Invalid module status/);
        });

        test('detectEnv returns booleans and survives a hostile window', () => {
          const { detectEnv } = registry.get('shared');
          const hostile = {
            get location() {
              throw new Error('blocked');
            },
            get navigator() {
              throw new Error('blocked');
            },
            get isSecureContext() {
              throw new Error('blocked');
            },
            get indexedDB() {
              throw new Error('blocked');
            },
          };
          const env = detectEnv(hostile);
          assertEqual(env.secureContext, false, 'secureContext on hostile window');
          assertEqual(env.protocol, 'unknown', 'protocol on hostile window');
          const real = detectEnv(window);
          for (const key of [
            'secureContext',
            'online',
            'getUserMedia',
            'mediaRecorder',
            'captureStream',
            'faceDetector',
            'webAssembly',
            'localStorage',
            'indexedDB',
          ]) {
            assertEqual(typeof real[key], 'boolean', `env.${key} type`);
          }
        });

        // --- content ---
        test('the bundled packs load in order: football, cricket, countries', () => {
          const { catalog } = registry.get('content');
          const categories = catalog.categories();
          assertEqual(
            categories.map((c) => c.id).join(','),
            'football,cricket,countries',
            'Category order',
          );
          for (const category of categories) {
            assert(category.itemCount >= 30, `${category.id} should have at least 30 picks`);
            assert(/^#[0-9a-f]{6}$/i.test(category.accent), `${category.id} accent`);
          }
        });

        test('every bundled item has a unique id, a name and a known image shape', () => {
          const { catalog } = registry.get('content');
          for (const { id } of catalog.categories()) {
            const pack = catalog.get(id);
            const seen = new Set();
            for (const item of pack.items) {

          assert(Number.isFinite(fps) && fps > 5, `Unexpected frame rate ${fps}`);
        });

        const playRoute = { name: 'play', categoryId: 'football' };

        test('the play screen offers the camera but never opens it by itself', () => {
          const devices = makeFakeMediaDevices();
          const { element, destroy } = registry.get('ui').previewScreen(playRoute, { mediaDevices: devices });
          assertEqual(devices.calls.length, 0, 'No camera request on load');
          assert(element.querySelector('[data-action="camera-start"]'), 'Start camera button');
          assert(!element.querySelector('video'), 'No video before the camera starts');
          const note = element.querySelector('[data-camera-note]').textContent;
          assert(/never uploaded/i.test(note), 'The privacy note says nothing is uploaded');
          destroy();
        });

        test('Start camera shows a live preview and Stop releases it', async () => {
          const devices = makeFakeMediaDevices();
          const { element, destroy } = registry.get('ui').previewScreen(playRoute, { mediaDevices: devices });
          element.querySelector('[data-action="camera-start"]').click();
          await waitFor(() => element.querySelector('video'), 'the live preview');
          const video = element.querySelector('video');
          assert(video.srcObject === devices.streams[0], 'The preview shows the camera stream');
          assert(video.muted && video.hasAttribute('playsinline'), 'Mobile-safe video attributes');
          assert(!element.querySelector('[data-camera-live]').hidden, 'Live chip shown');
          assert(element.querySelector('[data-action="camera-switch"]'), 'Switch button with two cameras');
          assert(!element.querySelector('[data-action="camera-start"]'), 'Start button hidden while on');
          element.querySelector('[data-action="camera-stop"]').click();
          assert(streamEnded(devices.streams[0]), 'Stop releases the camera');
          assert(!element.querySelector('video'), 'Preview removed');
          assert(element.querySelector('[data-action="camera-start"]'), 'Start button is back');
          assert(element.querySelector('[data-camera-live]').hidden, 'Live chip hidden');
          destroy();
        });

        test('only the front camera preview is mirrored', async () => {
          const devices = makeFakeMediaDevices();
          const { element, destroy } = registry.get('ui').previewScreen(playRoute, { mediaDevices: devices });
          element.querySelector('[data-action="camera-start"]').click();
          await waitFor(() => element.querySelector('video'), 'the live preview');
          const video = element.querySelector('video');
          assert(video.classList.contains('stage__video--mirror'), 'Front camera is mirrored');
          element.querySelector('[data-action="camera-switch"]').click();
          await waitFor(
            () => element.querySelector('video') && !video.classList.contains('stage__video--mirror'),
            'the back camera preview',
          );
          element.querySelector('[data-action="camera-switch"]').click();
          await waitFor(
            () => element.querySelector('video') && video.classList.contains('stage__video--mirror'),
            'the front camera preview again',
          );
          destroy();
        });

        test('a blocked camera shows a friendly message and the game still works', async () => {
          const devices = makeFakeMediaDevices();
          devices.failNext('NotAllowedError');
          const { element, game, destroy } = registry
            .get('ui')
            .previewScreen(playRoute, { mediaDevices: devices });
          element.querySelector('[data-action="camera-start"]').click();
          await waitFor(() => element.querySelector('[data-camera-panel="error"]'), 'the error panel');
          const panel = element.querySelector('[data-camera-panel="error"]');
          assert(/Camera not allowed/.test(panel.textContent), 'Plain-language title');
          assert(
            /lock icon/.test(element.querySelector('[data-camera-note]').textContent),
            'The note says how to allow the camera',
          );
          assert(!/NotAllowedError/.test(element.textContent), 'No technical error name on screen');
          assert(element.querySelector('[data-action="camera-retry"]'), 'Try again button');
          element.querySelector('[data-action="primary"]').click();
          element.querySelector('[data-slot="4"]').click();
          assertEqual(game.snapshot().placed, 1, 'The game works without the camera');
          element.querySelector('[data-action="camera-retry"]').click();
          await waitFor(() => element.querySelector('video'), 'the preview after retrying');
          destroy();
        });

        test('an unsupported or insecure browser shows a clear message without a Start button', () => {
          const ui = registry.get('ui');
          const cases = [
            [{ mediaDevices: null }, /cannot open the camera/],
            [{ mediaDevices: makeFakeMediaDevices(), secureContext: false }, /https/],
          ];
          for (const [overrides, pattern] of cases) {
            const { element, destroy } = ui.previewScreen(playRoute, overrides);
            const panel = element.querySelector('[data-camera-panel="error"]');
            const note = element.querySelector('[data-camera-note]');
            assert(panel, 'Error panel');
            assert(!note.hidden && pattern.test(note.textContent), `Message for ${JSON.stringify(Object.keys(overrides))}`);
            assert(!element.querySelector('[data-action="camera-start"]'), 'No Start button');
            assert(!element.querySelector('[data-action="camera-retry"]'), 'No Try again button');
            destroy();
          }
        });

        test('leaving the play screen releases the camera', async () => {
          const devices = makeFakeMediaDevices();
          const { element, destroy } = registry.get('ui').previewScreen(playRoute, { mediaDevices: devices });
          element.querySelector('[data-action="camera-start"]').click();
          await waitFor(() => element.querySelector('video'), 'the live preview');
          const video = element.querySelector('video');
          destroy();
          assert(streamEnded(devices.streams[0]), 'Camera released');
          assert(!video.srcObject, 'Preview detached');
        });

        test('sending the app to the background turns the camera off', async () => {
          const devices = makeFakeMediaDevices();
          const { element, destroy } = registry.get('ui').previewScreen(playRoute, { mediaDevices: devices });
          element.querySelector('[data-action="camera-start"]').click();
          await waitFor(() => element.querySelector('video'), 'the live preview');
          Object.defineProperty(document, 'visibilityState', { configurable: true, get: () => 'hidden' });
          try {
            document.dispatchEvent(new Event('visibilitychange'));
          } finally {
            delete document.visibilityState;
          }
          assert(streamEnded(devices.streams[0]), 'Camera released');
          assert(/background/.test(element.querySelector('[data-camera-note]').textContent), 'Explains why');
          destroy();
        });

        test('diagnostics keeps the automated tests and the real camera check apart', () => {
          const { element, destroy } = registry.get('ui').previewScreen({ name: 'diagnostics' });
          const headings = Array.from(element.querySelectorAll('h3')).map((node) => node.textContent);
          assert(headings.includes('Automated self-tests'), 'Automated tests heading');
          assert(headings.includes('Real camera check (manual)'), 'Manual check heading');
          assert(
            /do not test your real camera/.test(element.textContent),
            'The automated tests say they do not use the real camera',
          );
          destroy();
        });

        test('the manual camera check reports measurements and proves the camera is released', async () => {
          const devices = makeFakeMediaDevices();
          const { element, destroy } = registry
            .get('ui')
            .previewScreen({ name: 'diagnostics' }, { mediaDevices: devices, fpsWindowMs: 40 });
          const card = element.querySelector('[data-camera-check]');
          const button = card.querySelector('[data-action="camera-check"]');
          button.click();
          assert(button.disabled, 'The button is disabled while the check runs');
          await waitFor(() => !button.disabled, 'the camera check to finish', 12000);
          const rows = card.querySelector('[data-camera-check-results]').textContent;
          for (const label of [
            'Camera opened in',
            'First video frame',
            'Picture size',
            'Cameras found',
            'Camera released afterwards',
          ]) {
            assert(rows.includes(label), `Missing row: ${label}`);
          }
          assertEqual(devices.streams.length, 1, 'One stream');
          assert(streamEnded(devices.streams[0]), 'The camera is released');
          destroy();
        });

        test('the manual camera check explains a blocked camera', async () => {
          const devices = makeFakeMediaDevices();
          devices.failNext('NotAllowedError');
          const { element, destroy } = registry
            .get('ui')
            .previewScreen({ name: 'diagnostics' }, { mediaDevices: devices });
          const card = element.querySelector('[data-camera-check]');
          const button = card.querySelector('[data-action="camera-check"]');
          button.click();
          await waitFor(() => !button.disabled, 'the camera check to finish', 4000);
          const rows = card.querySelector('[data-camera-check-results]').textContent;
          assert(/Camera not allowed/.test(rows), 'Friendly result');
          assert(/NotAllowedError/.test(rows), 'The raw browser error is listed for diagnostics');
          assertEqual(devices.streams.length, 0, 'No stream was opened');
          destroy();
        });

        // --- page ---
        test('the page is self-contained (no external resources)', () => {
          const external = document.querySelectorAll(
            'script[src], link[rel~="stylesheet"], link[href]:not([href^="data:"]), ' +
              'img[src]:not([src^="data:"]), iframe, video[src], audio[src], source[src]',
          );
          assertEqual(external.length, 0, 'External resource count');
        });

        test('the page declares a responsive viewport and a content security policy', () => {
          const viewport = document.querySelector('meta[name="viewport"]');
          assert(viewport && /width=device-width/.test(viewport.content), 'Viewport meta');
          assert(
            document.querySelector('meta[http-equiv="Content-Security-Policy"]'),
            'CSP meta missing',
          );
        });

        test('the shell keeps its landmarks and the version footer on every screen', () => {
          assert(document.querySelector('header h1'), 'Header title');
          assert(document.querySelector('main#main'), 'Main landmark');
          const footer = document.querySelector('[data-footer]');
          const { config } = registry.get('shared');
          assert(footer && footer.textContent.includes(config.app.version), 'Footer version');
        });

        test('every button on the live page has an accessible name', () => {
          for (const button of document.querySelectorAll('button')) {
            const label = button.getAttribute('aria-label') || button.textContent.trim();
            assert(label.length > 0, 'Button without a name');
          }
        });

        /**
         * Runs every test and stores the summary on window.__BR_TESTS__.
         * @returns {Promise<{total: number, passed: number, failed: number, results: any[]}>}
         */
        async function runTests() {
          const results = [];
          for (const { name, run } of TESTS) {
            try {
              await run();
              results.push({ name, ok: true });
            } catch (error) {
              results.push({ name, ok: false, error: String((error && error.message) || error) });
            }
          }
          const failed = results.filter((r) => !r.ok).length;
          const summary = { total: results.length, passed: results.length - failed, failed, results };
          window.__BR_TESTS__ = summary;
          return summary;
        }

        /* ===== END TESTS ===== */

        /* ===== BOOTSTRAP (becomes src/main.js) ===== */

        /**
         * Shows a startup failure in the page instead of leaving it blank.
         * @param {HTMLElement} root
         * @param {unknown} error
         */
        function renderFatal(root, error) {
          const box = document.createElement('div');
          box.className = 'fatal';
          const title = document.createElement('h2');
          title.textContent = 'The app could not start';
          const detail = document.createElement('pre');
          detail.textContent = String((error && error.message) || error);
          box.append(title, detail);
          root.replaceChildren(box);
          window.__BR_FATAL__ = detail.textContent;
        }

        function start() {
          const root = document.getElementById('app');
          if (!root) {
            return;
          }
          try {
            registry.boot();
            registry.get('ui').mount(root, { runTests });
          } catch (error) {
            renderFatal(root, error);
          }
        }

        // Small debug handle for the browser console. Not used by the app itself.
        window.BR = Object.freeze({
          get: registry.get,
          list: registry.list,
          runTests,
          version: registry.get('shared').config.app.version,
        });

        start();
        /* ===== END BOOTSTRAP ===== */
      })();
    </script>
  </body>
</html>
